product_id: "grid"
name: "Woven Filter Mesh Grid 400"
category: "surface_structures"
plant_id: "DE-HAM"

image_size:
  width: 256
  height: 256

roi:
  x1: 0
  y1: 0
  x2: 256
  y2: 256

alignment:
  enabled: false
  method: "none"
  min_inliers: 0

anomaly_model:
  type: "patchcore"
  backbone: "wide_resnet50_2"
  coreset_ratio: 0.10
  feature_layers: ["layer2", "layer3"]
  threshold_pass: 0.35
  threshold_reject: 0.60
  heatmap_sigma: 3.5

classifier_model:
  enabled: true
  architecture: "resnet18"
  input_size: 224
  temperature_calibration: 1.30
  classes:
    - "crazing"
    - "inclusion"
    - "patches"
    - "pitted_surface"
    - "rolled_in_scale"
    - "scratches"
    - "good"

cost_matrix:
  cost_escape: 50.0
  cost_false_reject: 1.0
  cost_review: 0.3
  max_review_rate: 0.08
  random_audit_ratio: 0.02
