camera_id: "cam4_perimeter"
name: "Perimeter Walkway & Hazardous Storage (DE-HAM)"
plant_id: "DE-HAM"
rtsp_url: "rtsp://mediamtx:8554/cam4"
fallback_url: "rtsp://localhost:8554/cam4"
target_fps: 5.0
width: 1920
height: 1080
reconnect:
  initial_backoff_sec: 1.0
  max_backoff_sec: 30.0
  backoff_multiplier: 2.0
  timeout_sec: 5.0
queue:
  maxsize: 4
  drop_policy: "drop_oldest"

zones:
  - id: "zone_hazmat_boundary"
    name: "Chemical Storage Exclusion Zone"
    type: "exclusion_zone"
    required_ppe: ["helmet", "vest"]
    polygon:
      - [500, 250]
      - [1300, 250]
      - [1500, 950]
      - [350, 950]

homography:
  image_points:
    - [500, 250]
    - [1300, 250]
    - [1500, 950]
    - [350, 950]
  floor_points_meters:
    - [0.0, 0.0]
    - [8.0, 0.0]
    - [8.0, 10.0]
    - [0.0, 10.0]

rules:
  - id: "rule_hazmat_line_crossing"
    type: "line_cross"
    line:
      - [500, 600]
      - [1400, 600]
    direction: "entry"
    cooldown_sec: 30.0
