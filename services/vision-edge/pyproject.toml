[project]
name = "fieldkit-vision-edge"
version = "0.1.0"
description = "Fieldkit Multi-Camera Edge Video Analytics Platform (P5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fieldkit-common",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "prometheus-client>=0.21.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "onnxruntime>=1.20.0",
]

[tool.uv.sources]
fieldkit-common = { workspace = true }
