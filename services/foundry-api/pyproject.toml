[project]
name = "fieldkit-foundry-api"
version = "0.1.0"
description = "Fieldkit Foundry REST API and Governance Endpoints"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "fieldkit-common",
    "fieldkit-ingest",
    "fieldkit-llm",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldkit_foundry"]
