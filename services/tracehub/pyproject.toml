[project]
name = "fieldkit-tracehub"
version = "0.1.0"
description = "Fieldkit Tracehub: LLM Observability, Evaluation & Anomaly Alerting Service"
requires-python = ">=3.12"
dependencies = [
    "fieldkit-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldkit_tracehub"]

[tool.uv.sources]
fieldkit-common = { workspace = true }
