[project]
name = "fieldkit-hello"
version = "0.1.0"
description = "Fieldkit Hello test service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fieldkit-common",
    "fieldkit-llm",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldkit_hello"]
