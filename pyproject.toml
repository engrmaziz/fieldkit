[project]
name = "fieldkit"
version = "0.1.0"
description = "Fieldkit: Forward-Deployed AI Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4.0",
    "duckdb>=1.1.0",
    "httpx>=0.28.0",
    "minio>=7.2.0",
    "openpyxl>=3.1.5",
    "pandera>=0.22.0",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=18.0.0",
    "pyyaml>=6.0.2",
    "splink>=4.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "tiktoken>=0.14.0",
    "selectolax>=1.0.1",
    "pymupdf>=2.0",
    "sqlglot>=26.0.0",
    "scikit-learn>=1.9.1",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
    "opencv-python-headless>=4.10.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.20",
]


[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv.sources]
fieldkit-common = { workspace = true }
fieldkit-llm = { workspace = true }
fieldkit-mock-soap = { workspace = true }
fieldkit-ingest = { workspace = true }
fieldkit-foundry-api = { workspace = true }
fieldkit-er = { workspace = true }
fieldkit-ontology = { workspace = true }
fieldkit-retrieval = { workspace = true }
fieldkit-nl2sql = { workspace = true }
fieldkit-assistant-api = { workspace = true }
fieldkit-tracehub = { workspace = true }
fieldkit-ticketclf = { workspace = true }
fieldkit-mock-erp = { workspace = true }
fieldkit-copilot = { workspace = true }
fieldkit-docai = { workspace = true }
fieldkit-vision-edge = { workspace = true }
fieldkit-mlops = { workspace = true }

[dependency-groups]

dev = [
    "aiosqlite>=0.22.1",
    "hypothesis>=6.100.0",
    "mypy>=1.14.0",
    "onnx>=1.23.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
]
ignore = ["E501", "B008", "ASYNC109", "ASYNC240"]


[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "respx.*",
    "jose.*",
    "opentelemetry.*",
    "pyarrow.*",
    "yaml.*",
    "sklearn.*",
    "scipy.*",
    "onnxruntime.*",
    "tokenizers.*",
    "datasets.*",
    "pytesseract.*",
    "pdf2image.*",
    "transformers.*",
    "torch.*",
]
ignore_missing_imports = true



[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "tests"]
pythonpath = ["."]
