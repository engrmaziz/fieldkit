# Master 20 Incident Scenarios for Project 7 LLM Observability & Anomaly Alerting
# Covers failure modes across latency spikes, model swaps, broken prompt versions,
# error rate bursts, plant-specific degradation, and token explosions.

incidents:
  - id: "inc-01"
    name: "Prompt v3 Regressive Hallucination Loop"
    series: "assistant-api:assistant_rag_qa:qwen2.5:7b"
    metric: "latency_p95"
    detector: "robust_z"
    baseline_value: 580.0
    anomalous_value: 2150.0
    true_root_cause_dimension: "prompt_version"
    true_root_cause_value: "3.0.0-rc1"
    description: "Complex nested Jinja loop in unvetted prompt version causes 3.7x latency spike."

