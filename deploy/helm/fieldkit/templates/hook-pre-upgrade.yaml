{{- if .Values.preUpgradeHook.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fieldkit.fullname" . }}-pre-upgrade-db
  labels:
    {{- include "fieldkit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      name: {{ include "fieldkit.fullname" . }}-pre-upgrade-db
      labels:
        {{- include "fieldkit.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: {{ .Values.preUpgradeHook.image }}
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: {{ include "fieldkit.fullname" . }}-config
            - secretRef:
                name: {{ include "fieldkit.fullname" . }}-secrets
{{- end }}
