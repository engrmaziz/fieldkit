{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fieldkit.fullname" $ }}-{{ $name | kebabcase }}
  labels:
    {{- include "fieldkit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | kebabcase }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fieldkit.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name | kebabcase }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fieldkit.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name | kebabcase }}
    spec:
      containers:
        - name: {{ $name | kebabcase }}
          image: {{ $svc.image }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "fieldkit.fullname" $ }}-config
            - secretRef:
                name: {{ include "fieldkit.fullname" $ }}-secrets
          {{- if $svc.resources }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $name "console" }}/{{ else }}/readyz{{ end }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fieldkit.fullname" $ }}-{{ $name | kebabcase }}
  labels:
    {{- include "fieldkit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | kebabcase }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "fieldkit.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name | kebabcase }}
---
{{- end }}
