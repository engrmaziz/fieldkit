{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fieldkit.fullname" . }}-clickhouse
  labels:
    {{- include "fieldkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ include "fieldkit.fullname" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "fieldkit.componentSelector" (dict "root" . "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fieldkit.componentSelector" (dict "root" . "component" "clickhouse") | nindent 8 }}
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.httpPort }}
            - name: native
              containerPort: {{ .Values.clickhouse.nativePort }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: chdata
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: chdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fieldkit.fullname" . }}-clickhouse
  labels:
    {{- include "fieldkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.clickhouse.httpPort }}
      targetPort: http
    - name: native
      port: {{ .Values.clickhouse.nativePort }}
      targetPort: native
  selector:
    {{- include "fieldkit.componentSelector" (dict "root" . "component" "clickhouse") | nindent 4 }}
{{- end }}
---
{{- if .Values.redpanda.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fieldkit.fullname" . }}-redpanda
  labels:
    {{- include "fieldkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  serviceName: {{ include "fieldkit.fullname" . }}-redpanda
  replicas: 1
  selector:
    matchLabels:
      {{- include "fieldkit.componentSelector" (dict "root" . "component" "redpanda") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fieldkit.componentSelector" (dict "root" . "component" "redpanda") | nindent 8 }}
    spec:
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image }}
          command:
            - rpk
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - "1G"
            - --reserve-memory
            - "0M"
            - --kafka-addr
            - "PLAINTEXT://0.0.0.0:{{ .Values.redpanda.kafkaPort }}"
            - --advertise-kafka-addr
            - "PLAINTEXT://{{ include "fieldkit.fullname" . }}-redpanda:{{ .Values.redpanda.kafkaPort }}"
          ports:
            - name: kafka
              containerPort: {{ .Values.redpanda.kafkaPort }}
            - name: admin
              containerPort: {{ .Values.redpanda.adminPort }}
          resources:
            {{- toYaml .Values.redpanda.resources | nindent 12 }}
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.redpanda.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fieldkit.fullname" . }}-redpanda
  labels:
    {{- include "fieldkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: {{ .Values.redpanda.kafkaPort }}
      targetPort: kafka
    - name: admin
      port: {{ .Values.redpanda.adminPort }}
      targetPort: admin
  selector:
    {{- include "fieldkit.componentSelector" (dict "root" . "component" "redpanda") | nindent 4 }}
{{- end }}
