apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fieldkit.fullname" . }}-config
  labels:
    {{- include "fieldkit.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  PLANT_ID: {{ .Values.global.plantId | quote }}
  AIRGAP_MODE: {{ .Values.global.airGap | quote }}
  POSTGRES_HOST: "{{ include "fieldkit.fullname" . }}-postgres"
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  MINIO_ENDPOINT: "{{ include "fieldkit.fullname" . }}-minio:{{ .Values.minio.apiPort }}"
  REDIS_HOST: "{{ include "fieldkit.fullname" . }}-redis"
  REDIS_PORT: {{ .Values.redis.port | quote }}
  CLICKHOUSE_HOST: "{{ include "fieldkit.fullname" . }}-clickhouse"
  CLICKHOUSE_PORT: {{ .Values.clickhouse.httpPort | quote }}
  KAFKA_BROKERS: "{{ include "fieldkit.fullname" . }}-redpanda:{{ .Values.redpanda.kafkaPort }}"
  WORKFLOW_ENGINE_URL: "http://{{ include "fieldkit.fullname" . }}-workflow-engine:{{ .Values.workflowEngine.port }}"
  CONSOLE_DOMAIN: {{ .Values.ingress.hosts.console | quote }}
  API_DOMAIN: {{ .Values.ingress.hosts.api | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fieldkit.fullname" . }}-secrets
  labels:
    {{- include "fieldkit.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
