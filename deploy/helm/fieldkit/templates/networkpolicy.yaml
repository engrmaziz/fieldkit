{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fieldkit.fullname" . }}-ot-segmentation
  labels:
    {{- include "fieldkit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic within the fieldkit release namespace
    - from:
        - podSelector: {}
  egress:
    # Allow DNS within cluster
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow internal communication between Fieldkit platform components
    - to:
        - podSelector: {}
{{- end }}
