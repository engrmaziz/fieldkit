services:
  # ============================================================================
  # Profile: core (Shared Infrastructure)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fieldkit-postgres
    profiles: ["core", "all"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldkit}
      POSTGRES_USER: ${POSTGRES_USER:-fieldkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldkit_dev_insecure}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldkit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fieldkit-net

  redis:
    image: redis:7-alpine
    container_name: fieldkit-redis
    profiles: ["core", "all"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fieldkit-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: fieldkit-keycloak
    profiles: ["core", "all"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "${PORT_KEYCLOAK:-8080}:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldkit-net

  # ============================================================================
  # Profile: hello (Bootstrap verification service)
  # ============================================================================
  hello:
    build:
      context: ../..
      dockerfile: services/hello/Dockerfile
    container_name: fieldkit-hello
    profiles: ["hello", "all"]
    environment:
      ENVIRONMENT: development
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fieldkit-net

  # ============================================================================
  # Profile: foundry (Project 1: Mini Foundry)
  # ============================================================================
  foundry-api:
    image: alpine:latest
    container_name: fieldkit-foundry-api
    profiles: ["foundry", "all"]
    command: ["sleep", "infinity"]
    ports:
      - "${PORT_FOUNDRY:-8001}:8001"
    networks:
      - fieldkit-net

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: fieldkit-minio
    profiles: ["foundry", "all"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${PORT_MINIO_API:-9000}:9000"
      - "${PORT_MINIO_CONSOLE:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - fieldkit-net

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: fieldkit-minio-init
    profiles: ["foundry", "all"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/foundry-landing --ignore-existing;
      exit 0;
      "
    networks:
      - fieldkit-net

  mock-soap:
    build:
      context: ../../
      dockerfile: services/mock-soap/Dockerfile
    container_name: fieldkit-mock-soap
    profiles: ["foundry", "all"]
    ports:
      - "${PORT_MOCK_SOAP:-8010}:8010"
    environment:
      - PORT=8010
      - FAULT_500_RATE=${FAULT_500_RATE:-0.02}
      - FAULT_DELAY_RATE=${FAULT_DELAY_RATE:-0.01}
    networks:
      - fieldkit-net

  # ============================================================================
  # Profile: assistant (Project 2: RAG + NL2SQL)
  # ============================================================================
  assistant-api:
    image: alpine:latest
    container_name: fieldkit-assistant-api
    profiles: ["assistant", "all"]
    command: ["sleep", "infinity"]
    ports:
      - "${PORT_ASSISTANT:-8002}:8002"
    networks:
      - fieldkit-net

  # ============================================================================
  # Profile: copilot (Project 3: Ops Copilot)
  # ============================================================================
  mock-erp:
    build:
      context: ../..
      dockerfile: services/mock-erp/Dockerfile
    image: fieldkit-mock-erp:latest
    container_name: fieldkit-mock-erp
    profiles: ["copilot", "all"]
    ports:
      - "${PORT_MOCK_ERP:-8007}:8007"
    networks:
      - fieldkit-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: fieldkit-mailpit
    profiles: ["copilot", "all"]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - fieldkit-net

  copilot:
    build:
      context: ../..
      dockerfile: services/copilot/Dockerfile
    image: fieldkit-copilot:latest
    container_name: fieldkit-copilot
    profiles: ["copilot", "all"]
    ports:
      - "${PORT_COPILOT:-8003}:8003"
    networks:
      - fieldkit-net

  # ============================================================================
  # Profile: docai (Project 4: Doc Intelligence)
  # ============================================================================
  docai:
    build:
      context: ../..
      dockerfile: services/docai/Dockerfile
    image: fieldkit-docai:latest
    container_name: fieldkit-docai
    profiles: ["docai", "all"]
    environment:
      - PORT=8004
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET_DOCS=docs
    ports:
      - "${PORT_DOCAI:-8004}:8004"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fieldkit-net

  # ============================================================================
  # Profile: vision (Project 5 & 6: Video Analytics & Defect Inspection)
  # ============================================================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: fieldkit-mediamtx
    profiles: ["vision", "all"]
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
    environment:
      - MTX_PROTOCOLS=tcp,udp
    networks:
      - fieldkit-net

  cam1-publisher:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: fieldkit-cam1-publisher
    profiles: ["vision", "all"]
    command: >
      -re -stream_loop -1 -i /videos/cam1_press.mp4 -c:v copy -f rtsp rtsp://mediamtx:8554/cam1
    volumes:
      - ../../data/p5/videos:/videos:ro
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - fieldkit-net

  cam2-publisher:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: fieldkit-cam2-publisher
    profiles: ["vision", "all"]
    command: >
      -re -stream_loop -1 -i /videos/cam2_logistics.mp4 -c:v copy -f rtsp rtsp://mediamtx:8554/cam2
    volumes:
      - ../../data/p5/videos:/videos:ro
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - fieldkit-net

  cam3-publisher:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: fieldkit-cam3-publisher
    profiles: ["vision", "all"]
    command: >
      -re -stream_loop -1 -i /videos/cam3_assembly.mp4 -c:v copy -f rtsp rtsp://mediamtx:8554/cam3
    volumes:
      - ../../data/p5/videos:/videos:ro
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - fieldkit-net

  cam4-publisher:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: fieldkit-cam4-publisher
    profiles: ["vision", "all"]
    command: >
      -re -stream_loop -1 -i /videos/cam4_perimeter.mp4 -c:v copy -f rtsp rtsp://mediamtx:8554/cam4
    volumes:
      - ../../data/p5/videos:/videos:ro
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - fieldkit-net

  vision-edge:
    build:
      context: ../..
      dockerfile: services/vision-edge/Dockerfile
    image: fieldkit-vision-edge:latest
    container_name: fieldkit-vision-edge
    profiles: ["vision", "all"]
    environment:
      - PORT=8005
      - VISION_CONFIG_DIR=configs/cameras
      - VISION_VIDEO_DIR=data/p5/videos
      - RUNNING_IN_DOCKER=true
    ports:
      - "${PORT_VISION:-8005}:8005"
    depends_on:
      - mediamtx
    networks:
      - fieldkit-net

  # ============================================================================
  # Profile: observe (Project 7: LLM Observability & Anomaly Alerting)
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: fieldkit-clickhouse
    profiles: ["observe", "all"]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - fieldkit-net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: fieldkit-redpanda
    profiles: ["observe", "all"]
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    networks:
      - fieldkit-net

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: fieldkit-redpanda-console
    profiles: ["observe", "all"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8085:8080"
    depends_on:
      - redpanda
    networks:
      - fieldkit-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: fieldkit-otel-collector
    profiles: ["observe", "all"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - redpanda
    networks:
      - fieldkit-net

  tracehub:
    image: alpine:latest
    container_name: fieldkit-tracehub
    profiles: ["observe", "all"]
    command: ["sleep", "infinity"]
    ports:
      - "${PORT_TRACEHUB:-8006}:8006"
    networks:
      - fieldkit-net

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: fieldkit-ntfy
    profiles: ["observe", "all"]
    command: ["serve"]
    ports:
      - "8090:80"
    networks:
      - fieldkit-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fieldkit-grafana
    profiles: ["observe", "deploy", "all"]
    ports:
      - "3001:3001"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - clickhouse
    networks:
      - fieldkit-net

  # ============================================================================
  # Profile: deploy / workflow (Project 8: Air-gapped & Workflow Engine)
  # ============================================================================
  workflow-engine:
    build:
      context: ../..
      dockerfile: services/workflow-engine/Dockerfile
    container_name: fieldkit-workflow-engine
    profiles: ["workflow", "deploy", "p8", "all"]
    restart: unless-stopped
    environment:
      - PORT=8008
      - DATABASE_URL=postgres://${POSTGRES_USER:-fieldkit}:${POSTGRES_PASSWORD:-fieldkit_dev_insecure}@postgres:5432/${POSTGRES_DB:-fieldkit}?sslmode=disable
      - LOG_LEVEL=info
      - WORKER_CONCURRENCY=4
    ports:
      - "${PORT_WORKFLOW:-8008}:8008"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8008/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - fieldkit-net

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: fieldkit-prometheus
    profiles: ["deploy", "all"]
    ports:
      - "9090:9090"
    networks:
      - fieldkit-net

networks:
  fieldkit-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data:
