apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: clickhouse:8123
    jsonData:
      port: 8123
      server: clickhouse
      protocol: http
      defaultDatabase: fieldkit_tracehub
    isDefault: true
    editable: false

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
