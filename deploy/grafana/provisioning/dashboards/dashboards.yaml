apiVersion: 1

providers:
  - name: "Fieldkit Observability"
    orgId: 1
    folder: "Fieldkit Observability"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
