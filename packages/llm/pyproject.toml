[project]
name = "fieldkit-llm"
version = "0.1.0"
description = "Fieldkit unified async Ollama LLM client wrapper"
requires-python = ">=3.12"
dependencies = [
    "fieldkit-common",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "opentelemetry-api>=1.30.0",
    "pydantic>=2.10.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldkit_llm"]
