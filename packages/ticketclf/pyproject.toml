[project]
name = "fieldkit-ticketclf"
version = "0.1.0"
description = "Fieldkit multilingual ticket classification package"
requires-python = ">=3.12"
dependencies = [
    "fieldkit-common",
    "fieldkit-llm",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldkit_ticketclf"]
