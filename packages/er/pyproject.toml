[project]
name = "fieldkit-er"
version = "0.1.0"
description = "Fieldkit Entity Resolution & Survivorship package"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fieldkit-common",
    "fieldkit-llm",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "splink>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldkit_er"]
